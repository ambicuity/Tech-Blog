items:
  # ---- Compute & hosting --------------------------------------------------------------
  - name: Cloudflare Workers
    group: compute
    best_for: Edge compute and serverless APIs at the edge
    free_tier: 100k requests/day for globally distributed, stateless execution.
    self_host: partial
    self_host_note: The workerd runtime is open source.
    url: https://workers.cloudflare.com/
    url_pricing: https://developers.cloudflare.com/workers/platform/pricing/
    tier_type: free_tier
    card_required: no
    commercial_use: yes
    over_limit: Excess requests return errors; Workers Paid removes the daily cap.
    as_of: 2026-09-25
  - name: Vercel
    group: compute
    best_for: Next.js / React frontends and edge functions
    free_tier: 100 GB bandwidth/month and 100 GB-hours of Functions on the Hobby plan.
    self_host: no
    url: https://vercel.com/
    url_pricing: https://vercel.com/pricing
    tier_type: free_tier
    card_required: no
    commercial_use: yes
    over_limit: Deploys and Functions pause until the next cycle or you upgrade.
    not_ideal_for: Long-running or always-on background workers.
    as_of: 2026-09-25
  - name: Netlify
    group: compute
    best_for: Static sites and JAMstack frontends with edge functions
    free_tier: 100 GB bandwidth and 300k Functions invocations/month on the Free plan.
    self_host: no
    url: https://www.netlify.com/
    url_pricing: https://www.netlify.com/pricing/
    tier_type: free_tier
    card_required: no
    commercial_use: yes
    over_limit: Sites stay online but builds / functions may be throttled.
    as_of: 2026-09-25
  - name: Render
    group: compute
    best_for: Web services, cron jobs and managed Postgres
    free_tier: 750 hours/month of free instance time for web services and cron jobs (services spin down after 15 min idle).
    self_host: no
    url: https://render.com/
    url_pricing: https://render.com/pricing
    tier_type: free_tier
    card_required: no
    commercial_use: yes
    over_limit: Cold starts; no SLA on cold-start latency.
    not_ideal_for: Production workloads that must respond under 1 s every time.
    as_of: 2026-09-25
  - name: Fly.io
    group: compute
    best_for: Containerized app servers close to users
    free_tier: "Limited free trial: small Machines for up to 2 hours of runtime per app and up to 7 days per organization."
    self_host: no
    url: https://fly.io/
    url_pricing: https://fly.io/docs/about/free-trial/
    tier_type: free_trial
    card_required: yes
    commercial_use: yes
    over_limit: Trial apps stop running. No always-free VM allowance.
    not_ideal_for: Always-on production workloads on a free plan.
    as_of: 2026-09-25
  - name: Railway
    group: compute
    best_for: Quick deploys from a Git repo with usage-based billing
    free_tier: Trial plan starts with $5 of credit; the Hobby plan is $5/month plus $5 of included usage.
    self_host: no
    url: https://railway.com/
    url_pricing: https://railway.com/pricing
    tier_type: free_trial
    card_required: yes
    commercial_use: yes
    over_limit: Spend-based billing; you set a hard cap.
    not_ideal_for: Workloads where usage spikes must never trigger billing.
    as_of: 2026-09-25
  - name: GitHub Pages
    group: compute
    best_for: Static sites served from a repo
    free_tier: Unlimited static site hosting on GitHub Pages for public repos.
    self_host: no
    url: https://pages.github.com/
    tier_type: free_forever
    card_required: no
    commercial_use: yes
    over_limit: Soft limit of 1 GB / 100 GB bandwidth per site; builds timeout after 10 min.
    as_of: 2026-09-25

