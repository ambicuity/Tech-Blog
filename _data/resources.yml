# Free Developer Tools & Services (/free-stuff/).
#
# Free tiers change without notice: `as_of` records when an entry's details were
# last written, not a guarantee. Update `as_of` whenever you re-check an entry
# against the official pricing page.
#
# Schema:
#   name               Display name (required).
#   group              Group id from `groups:` below (required).
#   best_for           One-line use case (required).
#   free_tier          What you get on the free plan (required).
#   self_host          yes | no | partial — can you run it yourself?
#   self_host_note     Optional nuance on self-hosting.
#   url                Link to the tool's website (required).
#   url_pricing        Optional direct link to the pricing page.
#   url_github         Optional GitHub repo.
#   tier_type          free_forever | free_tier | free_trial | open_source (required).
#   card_required      yes | no — does signup need a payment method?
#   commercial_use     yes | no | review — allowed in commercial products?
#   over_limit         What happens when the free ceiling is hit.
#   not_ideal_for      Optional. When you should look elsewhere.
#   as_of              YYYY-MM-DD of the last manual re-check (required).

