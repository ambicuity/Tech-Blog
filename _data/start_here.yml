# "Start here" path on the home page: a short, ordered reading path for new
# readers. `post` is the post's URL slug (file name without the date).
# Editorial choice — re-curate freely; entries that no longer match a post
# are skipped at build time.
- post: understanding-kubernetes-networking-deep-dive
  why: How pods, Services and CNI move packets — the model the rest of the Kubernetes writing assumes.
- post: kubernetes-resource-requests-and-limits-masterclass
  why: Once traffic reaches your pods, requests and limits decide scheduling, CPU throttling and OOM kills.
- post: idempotent-operations-in-distributed-systems-a-practical-guide
  why: Services that talk over a network retry. This is how to make retries safe.
- post: transactional-outbox-reliable-events-without-dual-writes
  why: Builds on idempotency — publish events reliably when a database write and a message must both happen.
