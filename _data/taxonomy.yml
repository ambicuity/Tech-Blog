# Canonical taxonomy for the publication.
#
# _plugins/taxonomy.rb applies these rules to every post at build time, so
# posts produced by the content pipeline are normalized even when their front
# matter is not. Rules, in order:
#   1. Tags are lower-cased, trimmed and hyphenated ("Platform Engineering" ->
#      "platform-engineering"); characters other than a-z, 0-9, "-" and "."
#      are replaced with "-".
#   2. `tag_aliases` merges semantic duplicates into one canonical tag.
#   3. Tags in `tag_drop` carry no meaning for readers and are removed.
#   4. Categories are mapped through `category_aliases`; unknown categories
#      fall back to `default_category`. A post keeps at most two categories:
#      the first is its primary subject.

default_category: Software Engineering

# Display order on /tabs/categories/ follows this list.
categories:
  - name: AI
    title: AI Engineering
    description: >-
      What happens when AI-generated code meets production: incident reports,
      review workflows, guardrails and the engineering needed to make it safe.
  - name: Kubernetes
    description: >-
      Scheduling, networking, resource management, upgrades and day-2
      operations for clusters that carry real traffic.
  - name: Distributed Systems
    description: >-
      Idempotency, ordering, resilience patterns and service-to-service
      communication across unreliable networks.
  - name: Reliability
    description: >-
      Site reliability engineering: failure modes, observability, health
      checks, safe rollouts and incident analysis.
  - name: DevOps
    description: >-
      Delivery pipelines, progressive rollouts, GitOps, containers and
      infrastructure as code.
  - name: Platform Engineering
    description: >-
      Internal platforms, policy enforcement, cluster provisioning and the
      paved roads that product teams build on.
  - name: Cloud Computing
    description: >-
      AWS building blocks, serverless and event-driven architectures, and the
      cost of running them.
  - name: Performance
    description: >-
      Profiling, caching, concurrency and the measurements that separate a
      real speed-up from a benchmark artifact.
  - name: Python
    description: >-
      Production Python: asyncio, multiprocessing, interpreters, language
      features and the tooling around them.
  - name: Security
    description: >-
      Cluster hardening, secrets management, admission control and
      supply-chain safety.
  - name: Software Engineering
    description: >-
      Code quality, version control workflows, reviews, testing and the craft
      of maintaining software over time.
  - name: Database
    title: Databases
    description: >-
      Schema migrations, backups and operating stateful data stores safely.

# Legacy / pipeline-generated category names -> canonical category.
# A value of ~ removes the category (it carried no subject information).
