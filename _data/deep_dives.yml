# Deep Dives library (/courses/).
#
# Chapter counts and "last updated" dates are computed at build time from the
# pages under courses/<slug>/ and their git history (_plugins/courses.rb);
# `updated` below is only a fallback for builds without git history.
#
# listed: false keeps a course reachable at its URL but off the library page —
# per the library's own policy, a course is listed once the theory has been
# bridged to production practice.
#
# format: essay  -> a single long-form document
#         course -> a chaptered course with a syllabus

- slug: system-design
  title: System Design for AI
  subject: Distributed data systems
  source: Designing Data-Intensive Applications
  source_short: DDIA
  format: essay
  status: Living document
  updated: 2026-02-01
  listed: true
  description: >-
    Deconstructing the data-intensive application for modern LLM
    architectures: caching layers, high-throughput pipelines and the
    consistency trade-offs behind them.
  topics: [Replication, Partitioning, Caching, Stream processing, LLM serving]

