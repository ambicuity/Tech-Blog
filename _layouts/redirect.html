{%- assign _to = page.redirect_to | relative_url -%}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url={{ _to }}">
</head>
<body>
  <p>This page has moved to <a href="{{ _to }}">{{ page.redirect_to | absolute_url }}</a>.</p>
  <script>location.replace({{ _to | jsonify }});</script>
</body>
</html>
