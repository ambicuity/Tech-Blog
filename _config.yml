# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# Site settings
title: Ritesh Rana Tech Blog
tagline: Built by engineer, for engineers
description: Automated technical blog post generator using Google Gemini API
url: https://blog.riteshrana.engineer
baseurl: ""

github:
  username: ambicuity

social:
  name: Ritesh Rana
  links:
    - https://github.com/ambicuity
    - https://www.linkedin.com/in/riteshengineer/
    - https://riteshrana.engineer
  image: /assets/img/og-image.png

# Build settings
markdown: kramdown
permalink: /posts/:title/

# Timezone
timezone: UTC

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Jekyll plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives

jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: archives
    tag: archives
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

# Exclude from processing
exclude:
  - scripts/
  - requirements.txt
  - README.md
  - .gitignore
  - .github/
  - posts/
  - "*.gem"
  - "*.gemspec"
  - docs
  - node_modules
  - package*.json

# Chirpy theme settings
theme_mode: dark # [light|dark]

# The CDN endpoint for media resources.
# Notice that once it is assigned, the CDN url
# will be added to all media resources (site avatar, posts' images, audio and video files) paths starting with '/'
#
# e.g. 'https://cdn.com'
cdn:

# The avatar on sidebar, support local or CORS resources
avatar: https://riteshrana.engineer/assets/RR.webp 

toc: true

comments:
  active: giscus
  giscus:
    repo: ambicuity/Tech-Blog
    repo_id: R_kgDOQMkdDQ
    category: General
    category_id: DIC_kwDOQMkdDc4C1JM_
    mapping: pathname
    strict: 0
    reactions_enabled: 1
    input_position: bottom
    lang: en

google_analytics:
  id: G-FSTNSBY5ZH
  
assets:
  self_host:
    enabled: false

pwa:
  enabled: false

collections:
  tabs:
    output: true
    sort_by: order

