<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380">
  <title>The upgrade path in three steps: find every implicit encoding with the warning flag and the scanner, fix each call site with an explicit encoding, then verify the suite under UTF-8 mode on and off.</title>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="f-hatch"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" class="f-arrowhead"/>
    </marker>
  </defs>

  <text x="8" y="26" class="f-title">The upgrade path</text>

  <g data-step="1">
    <text x="8" y="56" class="f-label">1 FIND</text>
    <rect x="8" y="66" width="704" height="60" class="f-box"/>
    <text x="20" y="90" class="f-code">python -W error::EncodingWarning -m pytest</text>
    <text x="20" y="112" class="f-code">python3 find_implicit.py src/</text>
  </g>

  <line x1="360" y1="126" x2="360" y2="148" class="f-line" marker-end="url(#arrow)"/>

  <g data-step="2">
    <text x="8" y="172" class="f-label">2 FIX</text>
    <rect x="8" y="182" width="704" height="60" class="f-a1"/>
    <text x="20" y="206" class="f-code">encoding="utf-8" for interchange files</text>
    <text x="20" y="228" class="f-code">encoding="locale" for locale-owned files</text>
  </g>

  <line x1="360" y1="242" x2="360" y2="264" class="f-line" marker-end="url(#arrow)"/>

  <g data-step="3">
    <text x="8" y="288" class="f-label">3 VERIFY</text>
    <rect x="8" y="298" width="704" height="36" class="f-a2"/>
    <text x="20" y="321" class="f-code">CI under UTF-8 mode on and off, plus a C-locale run</text>
  </g>

  <line x1="8" y1="352" x2="712" y2="352" class="f-rule"/>
  <text x="8" y="374" class="f-small">1 a fix you cannot list, you cannot verify</text>
</svg>
