<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380">
  <title>What the requests instrumentation records by default versus what should reach the backend: the full URL with its query string is replaced by the route template and the method.</title>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="f-hatch"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" class="f-arrowhead"/>
    </marker>
  </defs>

  <text x="8" y="26" class="f-title">What reaches the backend</text>

  <g data-step="1">
    <text x="8" y="56" class="f-label">recorded by default</text>
    <rect x="8" y="66" width="480" height="32" class="f-a2"/>
    <text x="18" y="87" class="f-code">http.url = .../orders/42?token=secret</text>
    <text x="500" y="87" class="f-small">query included</text>
  </g>

  <g data-step="2">
    <line x1="248" y1="98" x2="248" y2="128" class="f-line" marker-end="url(#arrow)"/>
    <text x="8" y="150" class="f-label">keep: low cardinality</text>
    <rect x="8" y="160" width="340" height="120" class="f-a1"/>
    <text x="20" y="186" class="f-code">http.request.method = GET</text>
    <text x="20" y="210" class="f-code">http.route = GET /orders/{id}</text>
    <text x="20" y="234" class="f-code">server.address = shop.internal</text>
    <text x="20" y="258" class="f-code">order.currency = USD</text>
  </g>

  <g data-step="3">
    <text x="372" y="150" class="f-label">drop: sensitive or unbounded</text>
    <rect x="372" y="160" width="340" height="120" class="f-box"/>
    <text x="384" y="186" class="f-code">query strings (?token=...)</text>
    <text x="384" y="210" class="f-code">user ids in paths (/users/42)</text>
    <text x="384" y="234" class="f-code">raw query text with literals</text>
    <text x="384" y="258" class="f-code">request and response bodies</text>
  </g>

  <line x1="8" y1="312" x2="712" y2="312" class="f-rule"/>
  <text x="8" y="336" class="f-small">1 one series per order id is not observability, it is a cardinality bill</text>
  <text x="8" y="354" class="f-small">2 the route template groups every order id into one series the team can alert on</text>
</svg>
