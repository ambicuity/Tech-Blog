<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330">
  <title>Storage versions: who can read what</title>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="f-hatch"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" class="f-arrowhead"/>
    </marker>
  </defs>

  <text x="8" y="20" class="f-title">Storage versions: who can read what</text>

  <text x="8" y="48" class="f-label">Old file stays readable</text>
  <g data-step="1">
    <rect x="8" y="60" width="200" height="64" class="f-box"/>
    <text x="20" y="86" class="f-code">1.5.6 writes file</text>
    <text x="20" y="106" class="f-small">storage v68</text>
    <rect x="272" y="60" width="200" height="64" class="f-box"/>
    <text x="284" y="86" class="f-code">2.0.0 reads, writes</text>
    <text x="284" y="106" class="f-small">keeps v68</text>
    <rect x="536" y="60" width="176" height="64" class="f-a1"/>
    <text x="548" y="86" class="f-code">1.5.6 opens it</text>
    <text x="548" y="106" class="f-small">sum 28.75</text>
  </g>
  <g data-step="2">
    <line x1="212" y1="92" x2="268" y2="92" class="f-line" marker-end="url(#arrow)"/>
    <line x1="476" y1="92" x2="532" y2="92" class="f-line" marker-end="url(#arrow)"/>
  </g>

  <text x="8" y="158" class="f-label">New file closes the door</text>
  <g data-step="3">
    <rect x="8" y="170" width="200" height="64" class="f-box"/>
    <text x="20" y="196" class="f-code">2.0.0 creates file</text>
    <text x="20" y="216" class="f-small">storage v69</text>
    <rect x="272" y="170" width="200" height="64" class="f-box"/>
    <text x="284" y="196" class="f-code">1.5.6 opens it</text>
    <text x="284" y="216" class="f-small">IO Error</text>
  </g>
  <g data-step="4">
    <line x1="212" y1="202" x2="268" y2="202" class="f-line" marker-end="url(#arrow)"/>
    <rect x="536" y="170" width="176" height="64" class="f-a2"/>
    <text x="548" y="196" class="f-code">version 69</text>
    <text x="548" y="216" class="f-small">readable 64-68</text>
    <line x1="476" y1="202" x2="532" y2="202" class="f-a2-line" marker-end="url(#arrow)"/>
  </g>

  <line x1="8" y1="262" x2="712" y2="262" class="f-rule"/>
  <text x="8" y="286" class="f-small">1  the old file keeps its storage version when 2.0.0 writes to it</text>
  <text x="8" y="306" class="f-small">2  the new file is version 69, unreadable by any pre-2.0 version</text>
</svg>
