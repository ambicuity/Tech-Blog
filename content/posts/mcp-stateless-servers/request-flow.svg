<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392">
  <title>One self-contained MCP request: headers and _meta carry everything, and the answer comes back on the same POST</title>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="f-hatch"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" class="f-arrowhead"/>
    </marker>
  </defs>

  <text x="8" y="20" class="f-title">Client</text>
  <rect x="8" y="30" width="288" height="252" class="f-box"/>
  <g data-step="1">
    <text x="20" y="56" class="f-label">POST /mcp</text>
    <text x="20" y="80" class="f-code f-a1">MCP-Protocol-Version:</text>
    <text x="20" y="100" class="f-code f-a1">  2026-07-28</text>
    <text x="20" y="124" class="f-code f-a1">Mcp-Method: tools/call</text>
    <text x="20" y="148" class="f-code f-a1">Mcp-Name: sha256</text>
    <text x="20" y="176" class="f-code">body._meta:</text>
    <text x="20" y="196" class="f-code">  protocolVersion</text>
    <text x="20" y="216" class="f-code">  clientCapabilities</text>
    <text x="20" y="244" class="f-small">no session id, no handshake</text>
  </g>

  <text x="432" y="20" class="f-title">Server</text>
  <rect x="432" y="30" width="280" height="252" fill="url(#hatch)" class="f-frame"/>
  <g data-step="3">
    <rect x="446" y="46" width="252" height="104" class="f-box"/>
    <text x="458" y="70" class="f-label">validate envelope</text>
    <text x="458" y="94" class="f-code">header == _meta.version</text>
    <text x="458" y="114" class="f-code">Origin allowed?</text>
    <text x="458" y="134" class="f-code">method known?</text>
  </g>
  <g data-step="4">
    <rect x="446" y="162" width="252" height="104" class="f-box"/>
    <text x="458" y="186" class="f-label">answer on this POST</text>
    <text x="458" y="210" class="f-code">200 {"result": ...}</text>
    <text x="458" y="230" class="f-small">or a request-scoped SSE stream</text>
    <text x="458" y="250" class="f-small">closing it cancels the request</text>
  </g>

  <g data-step="2">
    <line x1="296" y1="140" x2="424" y2="140" class="f-line" marker-end="url(#arrow)"/>
    <circle cx="322" cy="128" r="9" class="f-a2"/>
    <text x="322" y="132" class="f-small f-middle f-a2">2</text>
  </g>
  <g data-step="4">
    <line x1="424" y1="214" x2="296" y2="214" class="f-line f-dashed" marker-end="url(#arrow)"/>
    <circle cx="398" cy="202" r="9" class="f-a3"/>
    <text x="398" y="206" class="f-small f-middle f-a3">4</text>
  </g>
  <g data-step="1">
    <circle cx="282" cy="60" r="9" class="f-a1"/>
    <text x="282" y="64" class="f-small f-middle f-a1">1</text>
  </g>
  <g data-step="3">
    <circle cx="560" cy="46" r="9" class="f-a4"/>
    <text x="560" y="50" class="f-small f-middle f-a4">3</text>
  </g>

  <line x1="8" y1="308" x2="712" y2="308" class="f-rule"/>
  <text x="8" y="332" class="f-small">1 every request carries its version, method and capabilities; there is no session to look up</text>
  <text x="8" y="354" class="f-small">2 one POST carries one JSON-RPC message; 3 the server validates the envelope and Origin</text>
  <text x="8" y="376" class="f-small">4 the answer returns on the same POST: one JSON object, or an SSE stream scoped to that request</text>
</svg>
