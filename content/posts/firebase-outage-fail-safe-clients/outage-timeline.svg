<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <title>Timeline of the 2026-09-28 Google Analytics for Firebase iOS SDK outage: a 2-line config cleanup at 17:38 PDT crashed apps globally by 17:41; alerts at 17:59, culprit found at 19:16, rollback complete at 19:52. The status dashboards stayed green the whole time.</title>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="f-hatch"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" class="f-arrowhead"/>
    </marker>
  </defs>

  <text x="8" y="24" class="f-title">GA4F outage, 2026-09-28 (PDT)</text>

  <line x1="40" y1="110" x2="680" y2="110" class="f-line"/>

  <line x1="40" y1="102" x2="40" y2="118" class="f-line"/>
  <line x1="54" y1="102" x2="54" y2="118" class="f-line"/>
  <line x1="140" y1="102" x2="140" y2="118" class="f-line"/>
  <line x1="508" y1="102" x2="508" y2="118" class="f-line"/>
  <line x1="680" y1="102" x2="680" y2="118" class="f-line"/>

  <circle cx="40" cy="110" r="9" class="f-a1"/>
  <text x="40" y="114" class="f-a1 f-middle">1</text>
  <circle cx="54" cy="110" r="9" class="f-a1"/>
  <text x="54" y="114" class="f-a1 f-middle">2</text>
  <circle cx="140" cy="110" r="9" class="f-a1"/>
  <text x="140" y="114" class="f-a1 f-middle">3</text>
  <circle cx="508" cy="110" r="9" class="f-a1"/>
  <text x="508" y="114" class="f-a1 f-middle">4</text>
  <circle cx="680" cy="110" r="9" class="f-a1"/>
  <text x="680" y="114" class="f-a1 f-middle">5</text>

  <text x="40" y="134" class="f-small f-middle">17:38</text>
  <text x="54" y="94" class="f-small f-middle">17:41</text>
  <text x="140" y="134" class="f-small f-middle">17:59</text>
  <text x="508" y="134" class="f-small f-middle">19:16</text>
  <text x="680" y="134" class="f-small f-middle">19:52</text>

  <text x="54" y="162" class="f-code">bad payload served to the whole fleet: 2 h 11 min</text>
  <rect x="54" y="170" width="626" height="16" class="f-a2"/>

  <text x="40" y="206" class="f-code">Firebase and Google Ads status dashboards: green</text>
  <rect x="40" y="214" width="640" height="16" class="f-a3"/>

  <line x1="8" y1="248" x2="712" y2="248" class="f-rule"/>
  <text x="8" y="270" class="f-small">1 17:38 stale flag cleanup merged (a 2-line change)  2 17:41 malformed payload rolls out globally</text>
  <text x="8" y="288" class="f-small">3 17:59 crash alerts spike; GitHub issues filed  4 19:16 culprit traced to the flag cleanup</text>
  <text x="8" y="306" class="f-small">5 19:52 rollback complete; bad payload served for 2 h 11 min. Dashboards stayed green throughout.</text>
</svg>
