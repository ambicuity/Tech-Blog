<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360">
  <title>One 15 percent error spike: the 1-hour average crosses the 1.44 percent threshold at minute 6 and the page fires; the 5-minute average clears 5 minutes after the errors stop.</title>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="f-hatch"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" class="f-arrowhead"/>
    </marker>
  </defs>
  <text x="8" y="26" class="f-title">One 15% error spike: when the page fires and stops</text>

  <rect x="70.0" y="40" width="90.0" height="220" class="f-a2"/>
  <text x="62" y="264.0" class="f-small f-end">0%</text>
  <text x="62" y="195.2" class="f-small f-end">5%</text>
  <text x="62" y="126.5" class="f-small f-end">10%</text>
  <text x="62" y="57.8" class="f-small f-end">15%</text>
  <line x1="70" y1="240.2" x2="700" y2="240.2" class="f-rule"/>
  <text x="700" y="100" class="f-small f-end">page threshold 1.44% (14.4x)</text>
  <line x1="660" y1="106" x2="660" y2="236.2" class="f-rule"/>
  <text x="70.0" y="280" class="f-small f-middle">0 min</text>
  <text x="160.0" y="280" class="f-small f-middle">10 min</text>
  <text x="250.0" y="280" class="f-small f-middle">20 min</text>
  <text x="340.0" y="280" class="f-small f-middle">30 min</text>
  <text x="430.0" y="280" class="f-small f-middle">40 min</text>
  <text x="520.0" y="280" class="f-small f-middle">50 min</text>
  <text x="610.0" y="280" class="f-small f-middle">60 min</text>
  <text x="700.0" y="280" class="f-small f-middle">70 min</text>
  <g data-step="1"><polyline points="70.0,260.0 88.0,253.1 106.0,246.2 115.0,242.8 124.0,239.4 142.0,232.5 160.0,225.6 178.0,225.6 196.0,225.6 205.0,225.6 214.0,225.6 250.0,225.6 340.0,225.6 610.0,225.6 646.0,239.4 655.0,242.8 700.0,260.0" class="f-a1-line"/></g>
  <g data-step="2"><polyline points="70.0,260.0 88.0,177.5 106.0,95.0 115.0,53.8 124.0,53.8 142.0,53.8 160.0,53.8 178.0,136.2 196.0,218.8 205.0,260.0 214.0,260.0 250.0,260.0 340.0,260.0 610.0,260.0 646.0,260.0 655.0,260.0 700.0,260.0" class="f-a2-line"/></g>
  <g data-step="3">
    <circle cx="124.0" cy="239.4" r="4" class="f-a1-solid"/>
    <text x="124.0" y="229.4" class="f-small f-middle">1</text>
    <circle cx="205.0" cy="260.0" r="4" class="f-a2-solid"/>
    <text x="205.0" y="250.0" class="f-small f-middle">2</text>
    <circle cx="430.0" cy="225.6" r="4" class="f-a1-solid"/>
    <text x="430.0" y="215.6" class="f-small f-middle">3</text>
  </g>
  <line x1="8" y1="296" x2="712" y2="296" class="f-rule"/>
  <line x1="8" y1="318" x2="36" y2="318" class="f-a1-line"/>
  <text x="44" y="322" class="f-small">1-hour average (long window)</text>
  <line x1="280" y1="318" x2="308" y2="318" class="f-a2-line"/>
  <text x="316" y="322" class="f-small">5-minute average (short window)</text>
  <text x="8" y="346" class="f-small">1 page fires at min 6   2 page stops at min 15   3 1h average alone stays above until min 65</text>
</svg>
