<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <title>Burn rate against time to exhaust a 99.9 percent SLO budget: 1x lasts 30 days, 1000x lasts 43 minutes.</title>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="f-hatch"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" class="f-arrowhead"/>
    </marker>
  </defs>
  <text x="8" y="26" class="f-title">Burn rate and time to exhaust a 99.9% budget</text>

  <text x="8" y="68" class="f-code">burn 1x</text>
  <rect x="150" y="54" width="420.0" height="18" class="f-a1"/>
  <text x="578.0" y="68" class="f-code">30 days</text>
  <text x="8" y="112" class="f-code">burn 2x</text>
  <rect x="150" y="98" width="377.9" height="18" class="f-a1"/>
  <text x="535.9" y="112" class="f-code">15 days</text>
  <text x="8" y="156" class="f-code">burn 10x</text>
  <rect x="150" y="142" width="280.0" height="18" class="f-a1"/>
  <text x="438.0" y="156" class="f-code">3 days</text>
  <text x="8" y="200" class="f-code">burn 100x</text>
  <rect x="150" y="186" width="162.4" height="18" class="f-a1"/>
  <text x="320.4" y="200" class="f-code">10.4 hours</text>
  <text x="8" y="244" class="f-code">burn 1000x</text>
  <rect x="150" y="230" width="2.0" height="18" class="f-a1"/>
  <text x="160.0" y="244" class="f-code">43 minutes</text>
  <line x1="8" y1="292" x2="712" y2="292" class="f-rule"/>
  <text x="8" y="312" class="f-small">Log scale: each step right is 10x longer. 1x = 0.1% errors; 1,000x = a total outage.</text>
</svg>
