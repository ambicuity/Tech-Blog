# Generated by slo.py from WORKBOOK_RULES_999.
# Do not edit by hand: regenerate with `python3 slo.py`.
# SLO: 99.9% over 30 days, service 'checkout'.
groups:
- name: slo-alerts
  rules:
  - alert: SloBudgetBurnPage
    expr: (
          job:slo_errors_per_request:ratio_rate1h{job="checkout"} > (14.4*0.001)
        and
          job:slo_errors_per_request:ratio_rate5m{job="checkout"} > (14.4*0.001)
        ) or (
          job:slo_errors_per_request:ratio_rate6h{job="checkout"} > (6.0*0.001)
        and
          job:slo_errors_per_request:ratio_rate30m{job="checkout"} > (6.0*0.001)
        )
    labels:
      severity: page
    annotations:
      summary: "Error budget burning too fast for checkout"
  - alert: SloBudgetBurnTicket
    expr: (
          job:slo_errors_per_request:ratio_rate3d{job="checkout"} > (1.0*0.001)
        and
          job:slo_errors_per_request:ratio_rate6h{job="checkout"} > (1.0*0.001)
        )
    labels:
      severity: ticket
    annotations:
      summary: "Error budget burning too fast for checkout"

