<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 850">
<title>Retry decision flow: five gates before any wait</title>
<defs>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="7" class="f-hatch"/>
</pattern>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L8 4 L0 8 z" class="f-arrowhead"/>
</marker>
</defs>
<text x="8" y="22" class="f-title">Five gates before any wait</text>
<g data-step="1">
<rect x="170" y="38" width="260" height="44" class="f-box"/>
<text x="300" y="65" class="f-code f-middle">call with_retries</text>
<line x1="300" y1="82" x2="300" y2="108" class="f-line" marker-end="url(#arrow)"/>
</g>
<g data-step="2">
<path d="M300 108 L430 150 L300 192 L170 150 z" class="f-box"/>
<text x="300" y="146" class="f-code f-middle">idempotent</text>
<text x="300" y="162" class="f-code f-middle">or keyed?</text>
<line x1="430" y1="150" x2="500" y2="150" class="f-line" marker-end="url(#arrow)"/>
<text x="465" y="142" class="f-small f-middle">no</text>
<line x1="300" y1="192" x2="300" y2="216" class="f-line" marker-end="url(#arrow)"/>
<text x="308" y="213" class="f-small">yes</text>
</g>
<g data-step="3">
<rect x="500" y="128" width="200" height="44" class="f-box"/>
<text x="600" y="155" class="f-code f-middle">run exactly once</text>
<line x1="600" y1="172" x2="600" y2="196" class="f-line" marker-end="url(#arrow)"/>
<text x="610" y="190" class="f-small">on failure</text>
<rect x="500" y="196" width="200" height="44" class="f-box"/>
<text x="600" y="223" class="f-code f-middle">give up: not_idempotent</text>
</g>
<g data-step="4">
<rect x="170" y="216" width="260" height="44" class="f-box"/>
<text x="300" y="243" class="f-code f-middle">attempt raises</text>
<line x1="300" y1="260" x2="300" y2="284" class="f-line" marker-end="url(#arrow)"/>
</g>
<g data-step="5">
<path d="M300 284 L430 326 L300 368 L170 326 z" class="f-box"/>
<text x="300" y="322" class="f-code f-middle">transient</text>
<text x="300" y="338" class="f-code f-middle">or throttling?</text>
<line x1="430" y1="326" x2="500" y2="326" class="f-line" marker-end="url(#arrow)"/>
<text x="465" y="318" class="f-small f-middle">no</text>
<rect x="500" y="304" width="200" height="44" class="f-box"/>
<text x="600" y="331" class="f-code f-middle">give up: permanent</text>
<line x1="300" y1="368" x2="300" y2="392" class="f-line" marker-end="url(#arrow)"/>
<text x="308" y="389" class="f-small">yes</text>
</g>
<g data-step="6">
<path d="M300 392 L430 434 L300 476 L170 434 z" class="f-box"/>
<text x="300" y="430" class="f-code f-middle">attempts left?</text>
<line x1="430" y1="434" x2="500" y2="434" class="f-line" marker-end="url(#arrow)"/>
<text x="465" y="426" class="f-small f-middle">no</text>
<rect x="500" y="412" width="200" height="44" class="f-box"/>
<text x="600" y="439" class="f-code f-middle">give up: max_attempts</text>
<line x1="300" y1="476" x2="300" y2="500" class="f-line" marker-end="url(#arrow)"/>
<text x="308" y="497" class="f-small">yes</text>
</g>
<g data-step="7">
<path d="M300 500 L430 542 L300 584 L170 542 z" class="f-box"/>
<text x="300" y="538" class="f-code f-middle">wait fits in</text>
<text x="300" y="554" class="f-code f-middle">deadline?</text>
<line x1="430" y1="542" x2="500" y2="542" class="f-line" marker-end="url(#arrow)"/>
<text x="465" y="534" class="f-small f-middle">no</text>
<rect x="500" y="520" width="200" height="44" class="f-box"/>
<text x="600" y="547" class="f-code f-middle">give up: deadline</text>
<line x1="300" y1="584" x2="300" y2="608" class="f-line" marker-end="url(#arrow)"/>
<text x="308" y="605" class="f-small">yes</text>
</g>
<g data-step="8">
<path d="M300 608 L430 650 L300 692 L170 650 z" class="f-box"/>
<text x="300" y="646" class="f-code f-middle">budget token?</text>
<line x1="430" y1="650" x2="500" y2="650" class="f-line" marker-end="url(#arrow)"/>
<text x="465" y="642" class="f-small f-middle">no</text>
<rect x="500" y="628" width="200" height="44" class="f-box"/>
<text x="600" y="655" class="f-code f-middle">give up: budget</text>
<line x1="300" y1="692" x2="300" y2="716" class="f-line" marker-end="url(#arrow)"/>
<text x="308" y="713" class="f-small">yes</text>
</g>
<g data-step="9">
<rect x="170" y="716" width="260" height="44" class="f-box"/>
<text x="300" y="743" class="f-code f-middle">sleep, then retry</text>
</g>
<line x1="8" y1="772" x2="712" y2="772" class="f-rule"/>
<text x="8" y="794" class="f-small">1 non-idempotent without a key runs exactly once and is never retried</text>
<text x="8" y="814" class="f-small">2 classify the error, then pass every gate before any wait</text>
<text x="8" y="834" class="f-small">3 a budget token is spent only on a retry that runs</text>
</svg>
