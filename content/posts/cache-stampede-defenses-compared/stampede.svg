<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310">
  <title>Thirty-two requests miss the same expired entry and each loads from the origin</title>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="f-hatch"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" class="f-arrowhead"/>
    </marker>
  </defs>

  <!-- 32 callers -->
  <text x="8" y="20" class="f-title">Callers</text>
  <rect x="8" y="30" width="208" height="190" fill="url(#hatch)" class="f-frame"/>
  <text x="20" y="52" class="f-label">32 requests, one key</text>
  <g>
    <rect x="20" y="64" width="16" height="16" class="f-box"/><rect x="44" y="64" width="16" height="16" class="f-box"/><rect x="68" y="64" width="16" height="16" class="f-box"/><rect x="92" y="64" width="16" height="16" class="f-box"/><rect x="116" y="64" width="16" height="16" class="f-box"/><rect x="140" y="64" width="16" height="16" class="f-box"/><rect x="164" y="64" width="16" height="16" class="f-box"/><rect x="188" y="64" width="16" height="16" class="f-box"/>
    <rect x="20" y="88" width="16" height="16" class="f-box"/><rect x="44" y="88" width="16" height="16" class="f-box"/><rect x="68" y="88" width="16" height="16" class="f-box"/><rect x="92" y="88" width="16" height="16" class="f-box"/><rect x="116" y="88" width="16" height="16" class="f-box"/><rect x="140" y="88" width="16" height="16" class="f-box"/><rect x="164" y="88" width="16" height="16" class="f-box"/><rect x="188" y="88" width="16" height="16" class="f-box"/>
    <rect x="20" y="112" width="16" height="16" class="f-box"/><rect x="44" y="112" width="16" height="16" class="f-box"/><rect x="68" y="112" width="16" height="16" class="f-box"/><rect x="92" y="112" width="16" height="16" class="f-box"/><rect x="116" y="112" width="16" height="16" class="f-box"/><rect x="140" y="112" width="16" height="16" class="f-box"/><rect x="164" y="112" width="16" height="16" class="f-box"/><rect x="188" y="112" width="16" height="16" class="f-box"/>
    <rect x="20" y="136" width="16" height="16" class="f-box"/><rect x="44" y="136" width="16" height="16" class="f-box"/><rect x="68" y="136" width="16" height="16" class="f-box"/><rect x="92" y="136" width="16" height="16" class="f-box"/><rect x="116" y="136" width="16" height="16" class="f-box"/><rect x="140" y="136" width="16" height="16" class="f-box"/><rect x="164" y="136" width="16" height="16" class="f-box"/><rect x="188" y="136" width="16" height="16" class="f-box"/>
  </g>
  <text x="20" y="182" class="f-small">all arrive at 12:00:00</text>

  <!-- Cache -->
  <text x="272" y="20" class="f-title">Cache</text>
  <rect x="272" y="30" width="176" height="190" fill="url(#hatch)" class="f-frame"/>
  <rect x="286" y="44" width="148" height="48" class="f-box"/>
  <text x="296" y="64" class="f-label">product:42</text>
  <text x="296" y="84" class="f-code">v1, fresh to 12:00</text>
  <g data-step="1">
    <rect x="286" y="104" width="148" height="48" rx="2" class="f-a1"/>
    <text x="296" y="124" class="f-label">product:42</text>
    <text x="296" y="144" class="f-code">expired 12:00:00</text>
  </g>
  <text x="296" y="182" class="f-small">one key, one expiry</text>

  <!-- Origin -->
  <text x="504" y="20" class="f-title">Origin</text>
  <rect x="504" y="30" width="208" height="190" fill="url(#hatch)" class="f-frame"/>
  <text x="516" y="52" class="f-label">the same load, 32 times</text>
  <g data-step="3">
    <rect x="516" y="64" width="184" height="14" rx="2" class="f-a1"/>
    <rect x="516" y="84" width="184" height="14" rx="2" class="f-a1"/>
    <rect x="516" y="104" width="184" height="14" rx="2" class="f-a1"/>
    <rect x="516" y="124" width="184" height="14" rx="2" class="f-a1"/>
    <text x="516" y="162" class="f-code">32 x 300 ms load</text>
  </g>

  <!-- Arrows -->
  <line x1="216" y1="110" x2="270" y2="110" class="f-line" marker-end="url(#arrow)" data-step="2"/>
  <text x="222" y="100" class="f-small" data-step="2">miss</text>
  <line x1="448" y1="110" x2="502" y2="110" class="f-line" marker-end="url(#arrow)" data-step="3"/>
  <text x="452" y="100" class="f-small" data-step="3">32 loads</text>

  <!-- Legend -->
  <line x1="8" y1="238" x2="712" y2="238" class="f-rule"/>
  <text x="8" y="262" class="f-small">1 the entry expires at 12:00:00</text>
  <text x="372" y="262" class="f-small">2 all 32 requests miss at once</text>
  <text x="8" y="284" class="f-small">3 each one runs the same 300 ms load</text>
  <text x="372" y="284" class="f-small">4 the origin sees 32x traffic, instantly</text>
</svg>
