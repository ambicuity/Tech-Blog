name: Generate Automated Blog Post

on:
  # Run weekly on Monday at 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      topic_hint:
        description: "Optional topic hint for planner"
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run production pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TOPIC_HINT: ${{ inputs.topic_hint }}
        run: |
          python scripts/run_pipeline.py

      - name: Validate latest published post (if any)
        run: |
          if git status --porcelain | awk '{print $2}' | grep -q '^_posts/'; then
            python scripts/validate_post.py
          else
            echo "No published post in this run; skipping post validator."
          fi
      
      - name: Configure Git
        run: |
          git config --local user.email "riteshrana36@gmail.com"
          git config --local user.name "ambicuity"
      
      - name: Commit and push changes
        id: git-push
        run: |
          for path in _posts _drafts .pipeline; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --staged --quiet; then
            echo "No new blog post to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
            echo "published=false" >> $GITHUB_OUTPUT
          else
            if git diff --staged --name-only | grep -q '^_posts/'; then
              echo "published=true" >> $GITHUB_OUTPUT
            else
              echo "published=false" >> $GITHUB_OUTPUT
            fi
            git commit -m "pipeline: gated content run - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Trigger deployment
        if: steps.git-push.outputs.pushed == 'true' && steps.git-push.outputs.published == 'true'
        run: gh workflow run pages-deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
