name: Generate Automated Blog Post

on:
  # Run daily at 09:00 UTC
  schedule:
    - cron: '0 9 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Generate blog post
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          python scripts/generate_blog.py
          

      - name: Format and Fix Posts
        run: |
          python scripts/format_posts.py

      - name: Validate generated post
        run: |
          python scripts/validate_post.py
      
      - name: Configure Git
        run: |
          git config --local user.email "riteshrana36@gmail.com"
          git config --local user.name "ambicuity"
      
      - name: Commit and push changes
        id: git-push
        run: |
          git add posts/ _posts/
          if git diff --staged --quiet; then
            echo "No new blog post to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "🤖 Auto-generate blog post - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Trigger deployment
        if: steps.git-push.outputs.pushed == 'true'
        run: gh workflow run pages-deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
