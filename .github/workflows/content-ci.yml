name: Content CI

# Quality gate for pull requests (including automated article PRs). Nothing
# here deploys: merging to main runs pages-deploy.yml, which repeats the
# same checks before publishing.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Validate content contract
        run: bundle exec ruby scripts/validate_content.rb

      - name: Test theme plugins and content
        run: bundle exec ruby test/plugins_test.rb

      - name: Build (production)
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check internal links, images and scripts
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Build draft preview
        run: bundle exec jekyll build --drafts --destination _preview
        env:
          JEKYLL_ENV: production

      - name: Check links in the draft preview
        run: |
          bundle exec htmlproofer _preview \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload draft preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-with-drafts
          path: _preview
          retention-days: 7
