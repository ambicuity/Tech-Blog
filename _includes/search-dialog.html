{%- comment -%}
  Search dialog. Behaviour lives in assets/js/search.js, loaded on first open.
  The index (/assets/js/data/search.json) is generated by _plugins/search_index.rb.
{%- endcomment -%}
<dialog id="search-dialog" class="dialog search-dialog" aria-label="Search the site">
  <div class="search-dialog__bar">
    {% include icon.html name="search" %}
    <label class="visually-hidden" for="search-input">Search articles, deep dives and topics</label>
    <input id="search-input" class="search-dialog__input" type="search" placeholder="Search articles, deep dives, tags…"
      autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go"
      role="combobox" aria-expanded="false" aria-autocomplete="list">
    <button type="button" class="icon-btn" data-dialog-close aria-label="Close search">{% include icon.html name="close" %}</button>
  </div>
  <div class="search-dialog__body" data-search-body>
    <p class="visually-hidden" role="status" aria-live="polite" data-search-status></p>
    <div data-search-view></div>
  </div>
  <div class="search-dialog__foot" aria-hidden="true">
    <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
    <span><kbd>↵</kbd> open</span>
    <span><kbd>esc</kbd> close</span>
  </div>
</dialog>
