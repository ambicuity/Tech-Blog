<!-- Interactive Terminal -->
<style>
    /* Terminal Styles */
    .terminal-window {
        background: #1e1e1e;
        border-radius: 6px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        font-family: 'Fira Code', 'Courier New', Courier, monospace;
        color: #f0f0f0;
        overflow: hidden;
        margin: 2rem 0;
        border: 1px solid #333;
    }

    .terminal-header {
        background: #2d2d2d;
        padding: 8px 12px;
        display: flex;
        align-items: center;
    }

    .terminal-button {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 6px;
    }

    .btn-red {
        background: #ff5f56;
    }

    .btn-yellow {
        background: #ffbd2e;
    }

    .btn-green {
        background: #27c93f;
    }

    .terminal-title {
        margin-left: auto;
        margin-right: auto;
        font-size: 0.8rem;
        opacity: 0.7;
    }

    .terminal-body {
        padding: 1rem;
        height: 300px;
        overflow-y: auto;
    }

    .terminal-output p {
        margin: 0.2rem 0;
        line-height: 1.4;
    }

    .command-line {
        display: flex;
        margin-top: 0.5rem;
    }

    .prompt {
        color: #27c93f;
        margin-right: 8px;
    }

    #cmd-input {
        background: transparent;
        border: none;
        color: #fff;
        flex-grow: 1;
        font-family: inherit;
        outline: none;
        caret-color: #27c93f;
    }

    .response-success {
        color: #fff;
    }

    .response-info {
        color: #61afef;
    }

    .response-error {
        color: #e06c75;
    }
</style>

<div class="terminal-window">
    <div class="terminal-header">
        <div class="terminal-button btn-red"></div>
        <div class="terminal-button btn-yellow"></div>
        <div class="terminal-button btn-green"></div>
        <div class="terminal-title">ritesh@macbook-pro:~</div>
    </div>
    <div class="terminal-body" id="terminal-body">
        <div class="terminal-output" id="terminal-output">
            <p>Welcome to Ritesh's interactive shell v1.0.0</p>
            <p class="response-info">Type 'help' to see available commands.</p>
        </div>
        <div class="command-line">
            <span class="prompt">➜ ~</span>
            <input type="text" id="cmd-input" autocomplete="off" aria-label="Terminal Input" autofocus>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const input = document.getElementById('cmd-input');
        const output = document.getElementById('terminal-output');
        const body = document.getElementById('terminal-body');

        const commands = {
            help: "Available commands: <br> - <span style='color:#e5c07b'>about</span>: Who am I?<br> - <span style='color:#e5c07b'>stack</span>: Check my tech stack<br> - <span style='color:#e5c07b'>contact</span>: Get in touch<br> - <span style='color:#e5c07b'>clear</span>: Clear terminal",
            about: "I'm Ritesh, a Platform Engineer passionate about Kubernetes, scalability, and developer experience.",
            stack: "🚀 **Core**: Python, Go, Bash<br>☁️ **Cloud**: AWS, GCP, DigitalOcean<br>☸️ **DevOps**: Kubernetes, Terraform, ArgoCD, Prometheus",
            contact: "Email: contact@riteshrana.engineer<br>GitHub: github.com/ambicuity",
            clear: "CLEAR_ACTION"
        };

        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                const cmd = input.value.trim().toLowerCase();

                // Add command to history
                output.innerHTML += `<p><span class="prompt">➜  ~</span> ${input.value}</p>`;

                if (cmd in commands) {
                    if (commands[cmd] === 'CLEAR_ACTION') {
                        output.innerHTML = '';
                    } else {
                        output.innerHTML += `<p class="response-success">${commands[cmd]}</p>`;
                    }
                } else if (cmd !== '') {
                    output.innerHTML += `<p class="response-error">Command not found: ${cmd}. Type 'help'.</p>`;
                }

                input.value = '';
                body.scrollTop = body.scrollHeight; // Auto scroll
            }
        });

        // Focus input when clicking anywhere in terminal
        document.querySelector('.terminal-window').addEventListener('click', () => {
            input.focus();
        });
    });
</script>
