<!-- Hero Section -->
<style>
    .hero-section {
        padding: 3rem 0;
        margin-bottom: 2rem;
        border-bottom: 1px solid var(--border-color);
    }

    .hero-greeting {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
        background: linear-gradient(to right, var(--link-color), #bc8cff);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
        font-size: 1.2rem;
        opacity: 0.8;
        margin-bottom: 1rem;
        min-height: 1.5em;
        /* Prevent layout shift */
    }

    .typing-cursor {
        display: inline-block;
        width: 2px;
        height: 1.2em;
        background-color: currentColor;
        margin-left: 2px;
        vertical-align: middle;
        animation: blink 1s step-end infinite;
    }

    @keyframes blink {
        50% {
            opacity: 0;
        }
    }
</style>

<div class="hero-section">
    <h1 class="hero-greeting">Hi, I'm Ritesh.</h1>
    <div class="hero-subtitle">
        I write about <span id="typing-text"></span><span class="typing-cursor"></span>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const textElement = document.getElementById("typing-text");
        const phrases = ["Kubernetes & Cloud Native", "Python & Automation", "Platform Engineering", "DevOps Best Practices"];
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let typeSpeed = 100;

        function type() {
            const currentPhrase = phrases[phraseIndex];

            if (isDeleting) {
                textElement.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
                typeSpeed = 50;
            } else {
                textElement.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
                typeSpeed = 100;
            }

            if (!isDeleting && charIndex === currentPhrase.length) {
                isDeleting = true;
                typeSpeed = 2000; // Pause at end
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                phraseIndex = (phraseIndex + 1) % phrases.length;
                typeSpeed = 500; // Pause before next phrase
            }

            setTimeout(type, typeSpeed);
        }

        type();
    });
</script>
