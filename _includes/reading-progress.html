<!-- Reading Progress Bar -->
<style>
    /* Progress Bar Container */
    #reading-progress-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        z-index: 1030;
        /* High z-index to stay on top */
        background: transparent;
        pointer-events: none;
        display: none;
        /* Hidden by default, script will show it */
    }

    /* The Bar itself */
    #reading-progress-bar {
        width: 0%;
        height: 100%;
        /* Use Chirpy's primary color or a fallback */
        background: var(--link-color, #007bff);
        box-shadow: 0 0 4px var(--link-color, #007bff);
        transition: width 0.1s ease-out;
    }
</style>

<div id="reading-progress-container">
    <div id="reading-progress-bar"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const progressBar = document.getElementById("reading-progress-bar");
        const container = document.getElementById("reading-progress-container");

        if (!progressBar || !container) return;

        // Show only if content is scrollable
        if (document.documentElement.scrollHeight > window.innerHeight) {
            container.style.display = 'block';
        }

        window.addEventListener("scroll", function () {
            const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;

            if (scrollHeight <= 0) {
                progressBar.style.width = "100%";
                return;
            }

            const scrollPercentage = (scrollTop / scrollHeight) * 100;
            progressBar.style.width = scrollPercentage + "%";
        });
    });
</script>
